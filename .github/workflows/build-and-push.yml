name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: ./services/api-gateway
            needs_build_args: false
          - name: auth-svc
            context: ./services/auth-svc
            needs_build_args: false
          - name: driver-ms
            context: ./services/driver-ms
            needs_build_args: false
          - name: email-svc
            context: ./services/email-svc
            needs_build_args: false
          - name: hello-svc
            context: ./services/hello-svc
            needs_build_args: false
          - name: logger-svc
            context: ./services/logger-svc
            needs_build_args: false
          - name: publisher-rabbit-srv
            context: ./services/publisher-rabbit-srv
            needs_build_args: false
          - name: users-srv
            context: ./services/users-srv
            needs_build_args: true
            build_args: |
              USERS_DATABASE_URL=postgresql://temp:temp@localhost:5432/temp?schema=public
          - name: vehicles-svc
            context: ./services/vehicles-svc
            needs_build_args: true
            build_args: |
              DATABASE_URL=postgresql://temp:temp@localhost:5432/temp?schema=public
              SHADOW_DATABASE_URL=postgresql://temp:temp@localhost:5432/temp_shadow?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/fuel-system/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image (without build args)
        if: ${{ !matrix.service.needs_build_args }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/fuel-system/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/fuel-system/${{ matrix.service.name }}:buildcache,mode=max

      - name: Build and push Docker image (with build args)
        if: ${{ matrix.service.needs_build_args }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build_args }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/fuel-system/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/fuel-system/${{ matrix.service.name }}:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  summary:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images built and pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| api-gateway | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| auth-svc | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| driver-ms | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| email-svc | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| hello-svc | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| logger-svc | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| publisher-rabbit-srv | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| users-srv (Prisma) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| vehicles-svc (Prisma) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.ACR_LOGIN_SERVER }}/fuel-system/" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
