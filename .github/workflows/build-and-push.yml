          docker build -t ${{ env.REGISTRY }}/fuel-system/users-srv:latest .
          docker push ${{ env.REGISTRY }}/fuel-system/users-srv:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/fuel-system/users-srv:latest

  # Build y Push para Vehicles Service
  build-vehicles-svc:
    needs: detect-changes
