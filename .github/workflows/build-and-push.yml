          docker build -t ${{ env.REGISTRY }}/fuel-system/vehicles-svc:latest .
          docker push ${{ env.REGISTRY }}/fuel-system/vehicles-svc:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/fuel-system/vehicles-svc:latest

  # Build y Push para Email Service
  build-email-svc:
    needs: detect-changes
    if: needs.detect-changes.outputs.email-svc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Azure Container Registry
