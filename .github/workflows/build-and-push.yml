          docker build -t ${{ env.REGISTRY }}/fuel-system/email-svc:latest .
          docker push ${{ env.REGISTRY }}/fuel-system/email-svc:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/fuel-system/email-svc:latest

  # Build y Push para Hello Service
  build-hello-svc:
