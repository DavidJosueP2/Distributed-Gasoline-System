          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Build and push Docker image
        working-directory: ./services/driver-ms
        run: |
          docker build -t ${{ env.REGISTRY }}/fuel-system/driver-ms:${{ env.IMAGE_TAG }} .
          docker build -t ${{ env.REGISTRY }}/fuel-system/driver-ms:latest .
          docker push ${{ env.REGISTRY }}/fuel-system/driver-ms:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/fuel-system/driver-ms:latest

  # Build y Push para Users Service
  build-users-srv:
    needs: detect-changes
    if: needs.detect-changes.outputs.users-srv == 'true'
