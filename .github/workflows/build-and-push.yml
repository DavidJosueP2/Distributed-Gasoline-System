          docker build -t ${{ env.REGISTRY }}/fuel-system/auth-svc:latest .
          docker push ${{ env.REGISTRY }}/fuel-system/auth-svc:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/fuel-system/auth-svc:latest

  # Build y Push para Driver Microservice
  build-driver-ms:
