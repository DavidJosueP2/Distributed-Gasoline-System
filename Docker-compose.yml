version: "3.9"

services:
  eureka:
    image: ygqygq2/eureka-server:latest
    container_name: eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/"]
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  
  auth-db:
    image: postgres:16
    container_name: auth-db-gasoline
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  users-db:
    image: postgres:16
    container_name: users-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./services/users-srv/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  vehicles-db:
    image: postgres:16
    container_name: vehicles-postgres
    env_file:
      - ./services/vehicles-svc/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER_VEH}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_VEH}
      POSTGRES_DB: ${POSTGRES_DB_VEH}
    volumes:
      - vehicles-db-data:/var/lib/postgresql/data
      - ./services/vehicles-svc/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: vehicles-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      vehicles-db:
        condition: service_healthy
    ports:
      - "5050:80"
    restart: unless-stopped

volumes:
  users-db-data:
  vehicles-db-data:
  auth-db-data:
