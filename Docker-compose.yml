services:
  eureka:
    image: ygqygq2/eureka-server:latest
    container_name: eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/"]
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  users-db:
    image: postgres:16
    container_name: users-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USERS_DB}
    ports:
      - "5434:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./services/users-srv/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  driver-db:
    image: postgres:16
    container_name: driver-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DRIVER_DB}
    ports:
      - "5436:5432"
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  users-db-data:
  driver-db-data: