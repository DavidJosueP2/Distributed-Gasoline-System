version: "3.9"

services:
  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Eureka ----------
  eureka:
    image: ygqygq2/eureka-server:latest
    container_name: eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/"]
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ---------- Auth Database ----------
  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS:-root}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}  
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Users Database ----------
  users-db:
    image: postgres:16
    container_name: users-db
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASS:-admin}
      POSTGRES_DB: ${USERS_DB_NAME:-users} 
    ports:
      - "5434:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./services/users-srv/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- Driver Database ----------
  driver-db:
    image: postgres:16
    container_name: driver-db
    environment:
      POSTGRES_USER: ${DRIVER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DRIVER_DB_PASS:-admin}
      POSTGRES_DB: ${DRIVER_DB_NAME:-drivers}  
    ports:
      - "5436:5432"
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRIVER_DB_USER} -d ${DRIVER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Vehicles Database ----------
  vehicles-db:
    image: postgres:16
    container_name: vehicles
    env_file:
      - ./services/vehicles-svc/.env
    volumes:
      - vehicles-db-data:/var/lib/postgresql/data
      - ./services/vehicles-svc/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- PGAdmin ----------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      users-db:
        condition: service_healthy
      vehicles-db:
        condition: service_healthy
      driver-db:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    ports:
      - "5050:80"
    restart: unless-stopped
  # ---------- Elasticsearch (Base de logs) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Kibana (Dashboard de logs) ----------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
    ports:
      - "5601:5601"
    restart: unless-stopped

volumes:
  users-db-data:
  driver-db-data:
  vehicles-db-data:
  auth-db-data:
  elasticsearch-data:
