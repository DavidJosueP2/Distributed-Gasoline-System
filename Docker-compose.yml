# ==============================================
# Docker Compose - TODO DOCKERIZADO
# ==============================================
# Contiene TODA la aplicación dockerizada (infraestructura + microservicios)
# Úsalo para pruebas completas o para desplegar todo junto
#
# Uso:
#   npm run docker:build  (construir imágenes)
#   npm run docker:up     (iniciar todo)

version: '3.8'

services:
  # ---------- Eureka Server ----------
  eureka-server:
    image: steeltoeoss/eureka-server
    container_name: fuel-eureka
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------- PostgreSQL - Auth DB ----------
  auth-db:
    image: postgres:16-alpine
    container_name: fuel-auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS:-root}
      POSTGRES_DB: ${AUTH_DB:-auth}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres} -d ${AUTH_DB:-auth}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- PostgreSQL - Users DB ----------
  users-db:
    image: postgres:16-alpine
    container_name: fuel-users-db
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASS:-admin}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - "${USERS_DB_PORT:-5434}:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-postgres} -d ${USERS_DB_NAME:-users}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- PostgreSQL - Vehicles DB ----------
  vehicles-db:
    image: postgres:16-alpine
    container_name: fuel-vehicles-db
    environment:
      POSTGRES_USER: ${VEHICLES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${VEHICLES_DB_PASS:-admin}
      POSTGRES_DB: ${VEHICLES_DB_NAME:-vehicles}
    ports:
      - "${VEHICLES_DB_PORT:-5435}:5432"
    volumes:
      - vehicles_db_data:/var/lib/postgresql/data
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VEHICLES_DB_USER:-postgres} -d ${VEHICLES_DB_NAME:-vehicles}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- PostgreSQL - Driver DB ----------
  driver-db:
    image: postgres:16-alpine
    container_name: fuel-driver-db
    environment:
      POSTGRES_USER: ${DRIVER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DRIVER_DB_PASS:-admin}
      POSTGRES_DB: ${DRIVER_DB_NAME:-drivers}
    ports:
      - "${DRIVER_DB_PORT:-5436}:5432"
    volumes:
      - driver_db_data:/var/lib/postgresql/data
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRIVER_DB_USER:-postgres} -d ${DRIVER_DB_NAME:-drivers}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fuel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---------- Elasticsearch ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: fuel-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - fuel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---------- Kibana ----------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: fuel-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - fuel-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==============================================
  # MICROSERVICIOS
  # ==============================================

  # ---------- API Gateway ----------
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: fuel-api-gateway
    env_file: .env
    environment:
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:${GATEWAY_HTTP_PORT:-8080}"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Auth Service ----------
  auth-svc:
    build:
      context: .
      dockerfile: ./services/auth-svc/Dockerfile
    container_name: fuel-auth-svc
    env_file: .env
    environment:
      - AUTH_DB_HOST=${AUTH_DB_HOST:-auth-db}
      - AUTH_DB_PORT=5432
      - AUTH_DB_USER=${AUTH_DB_USER:-postgres}
      - AUTH_DB_PASS=${AUTH_DB_PASS:-root}
      - AUTH_DB=${AUTH_DB:-auth}
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
      - SERVICE_REGISTER_HOST=fuel-auth-svc
      - REGISTER_HOST=fuel-auth-svc
    ports:
      - "${AUTH_GRPC_PORT:-50052}:${AUTH_GRPC_PORT:-50052}"
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:50052,host:'localhost'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Routes Database ----------
  routes-db:
    image: postgres:16
    container_name: fuelhub-routes-db
    environment:
      POSTGRES_USER: ${ROUTES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ROUTES_DB_PASS:-admin}
      POSTGRES_DB: ${ROUTES_DB_NAME:-routes}
    ports:
      - "5500:5432"
    volumes:
      - routes_db_data:/var/lib/postgresql/data
      - ./services/routes-srv/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROUTES_DB_USER} -d ${ROUTES_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fuel-network
    restart: unless-stopped

  # ---------- PGAdmin ----------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fuelhub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    networks:
      - fuel-network
    restart: unless-stopped

  # ---------- Users Service ----------
  users-srv:
    build:
      context: .
      dockerfile: ./services/users-srv/Dockerfile
      args:
        # Build arg temporal para prisma generate (no se persiste en imagen)
        USERS_DATABASE_URL: postgresql://postgres:admin@users-db:5432/users?schema=public
    container_name: fuel-users-srv
    env_file: .env
    environment:
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
      - SERVICE_REGISTER_HOST=fuel-users-srv
      - REGISTER_HOST=fuel-users-srv
    ports:
      - "${USERS_GRPC_PORT:-50057}:${USERS_GRPC_PORT:-50057}"
    depends_on:
      users-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:50057,host:'localhost'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "npx prisma db push --accept-data-loss && node dist/prisma/seed.js && node dist/src/main.js"

  # ---------- Vehicles Service ----------
  vehicles-svc:
    build:
      context: .
      dockerfile: ./services/vehicles-svc/Dockerfile
      args:
        # Build args temporales para prisma generate (no se persisten en imagen)
        DATABASE_URL: postgresql://postgres:admin@vehicles-db:5432/vehicles?schema=public
        SHADOW_DATABASE_URL: postgresql://postgres:admin@vehicles-db:5432/vehicles_shadow?schema=public
    container_name: fuel-vehicles-svc
    env_file: .env
    environment:
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
      - SERVICE_REGISTER_HOST=fuel-vehicles-svc
      - REGISTER_HOST=fuel-vehicles-svc
    ports:
      - "${VEHICLES_GRPC_PORT:-50055}:${VEHICLES_GRPC_PORT:-50055}"
    depends_on:
      vehicles-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:50055,host:'localhost'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/main.js"

  # ---------- Driver Service ----------
  driver-ms:
    build:
      context: .
      dockerfile: ./services/driver-ms/Dockerfile
    container_name: fuel-driver-ms
    env_file: .env
    environment:
      - DRIVER_DB_HOST=${DRIVER_DB_HOST:-driver-db}
      - DRIVER_DB_PORT=5432
      - DRIVER_DB_USER=${DRIVER_DB_USER:-postgres}
      - DRIVER_DB_PASS=${DRIVER_DB_PASS:-admin}
      - DRIVER_DB_NAME=${DRIVER_DB_NAME:-drivers}
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
      - SERVICE_REGISTER_HOST=fuel-driver-ms
      - REGISTER_HOST=fuel-driver-ms
    ports:
      - "${DRIVER_GRPC_PORT:-50062}:${DRIVER_GRPC_PORT:-50062}"
      - "${DRIVER_HTTP_PORT:-3100}:${DRIVER_HTTP_PORT:-3100}"
    depends_on:
      driver-db:
        condition: service_healthy
      users-srv:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      routes-db:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:50062,host:'localhost'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Email Service ----------
  email-svc:
    build:
      context: .
      dockerfile: ./services/email-svc/Dockerfile
    container_name: fuel-email-svc
    env_file: .env
    environment:
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
      - SERVICE_REGISTER_HOST=fuel-email-svc
      - REGISTER_HOST=fuel-email-svc
    ports:
      - "${EMAIL_GRPC_PORT:-50053}:${EMAIL_GRPC_PORT:-50053}"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:50053,host:'localhost'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Logger Service ----------
  logger-svc:
    build:
      context: ./services/logger-svc
      dockerfile: Dockerfile
    container_name: fuel-logger-svc
    env_file: .env
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_COMPATIBILITY_VERSION=${ELASTICSEARCH_COMPATIBILITY_VERSION:-8}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - LOGGER_HTTP_PORT=${LOGGER_HTTP_PORT:-3200}
    ports:
      - "${LOGGER_HTTP_PORT:-3200}:${LOGGER_HTTP_PORT:-3200}"
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Publisher Service ----------
  publisher-rabbit-srv:
    build:
      context: .
      dockerfile: ./services/publisher-rabbit-srv/Dockerfile
    container_name: fuel-publisher-rabbit
    env_file: .env
    environment:
      - PROTO_ROOT=/app/protos
      - PROTOS_DIR=/app/protos
      - PUBLISHER_HTTP_PORT=${OUTBOX_PUBLISHER_PORT:-4100}
      - SERVICE_REGISTER_HOST=fuel-publisher-rabbit
      - REGISTER_HOST=fuel-publisher-rabbit
    ports:
      - "${OUTBOX_PUBLISHER_PORT:-4100}:${OUTBOX_PUBLISHER_PORT:-4100}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fuel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ==============================================
# Redes y Volúmenes
# ==============================================

networks:
  fuel-network:
    driver: bridge

volumes:
  auth_db_data:
  users_db_data:
  vehicles_db_data:
  driver_db_data:
  routes_db_data:
  rabbitmq_data:
  elasticsearch_data:
