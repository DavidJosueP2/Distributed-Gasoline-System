clusterName: "elasticsearch"
replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

esJavaOpts: "-Xms512m -Xmx512m"

roles:
  master: "true"
  data: "true"
  ingest: "true"

persistence:
  enabled: true
  storageClass: "managed-csi"
  accessMode: ReadWriteOnce
  size: 5Gi

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "managed-csi"
  resources:
    requests:
      storage: 5Gi

sysctlInitContainer:
  enabled: true

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000

esConfig:
  elasticsearch.yml: |
    cluster.name: elasticsearch
    node.name: ${HOSTNAME}
    network.host: 0.0.0.0
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false

image: "docker.elastic.co/elasticsearch/elasticsearch"
imageTag: "7.17.3"
imagePullPolicy: "IfNotPresent"

service:
  type: NodePort
  port: 9200
  nodePort: 30920

protocol: http
httpPort: 9200

readinessProbe:
  initialDelaySeconds: 45
  periodSeconds: 10
  failureThreshold: 12
  timeoutSeconds: 5
