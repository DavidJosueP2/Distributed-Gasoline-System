## Cluster name
clusterName: "elasticsearch"

## Node configuration
replicas: 3
minimumMasterNodes: 2

## Resources
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

## Persistence
persistence:
  enabled: true
  storageClass: "managed-csi"
  accessMode: ReadWriteOnce
  size: 30Gi

## Volume claim template
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "managed-csi"
  resources:
    requests:
      storage: 30Gi

## Anti-affinity
antiAffinity: "hard"

## JVM Settings
esJavaOpts: "-Xmx1g -Xms1g"

## Roles
roles:
  - master
  - data
  - ingest

## Service
service:
  type: ClusterIP
  port: 9200

## HTTP
protocol: http
httpPort: 9200

## Sysctls
sysctlInitContainer:
  enabled: true

## Security context
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000

## Security configuration
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.enrollment.enabled: false
    xpack.security.autoconfiguration.enabled: false

## Image - Versión 7.17.3 estable para producción
image: "docker.elastic.co/elasticsearch/elasticsearch"
imageTag: "7.17.3"
imagePullPolicy: "IfNotPresent"

## Readiness probe - Configuración para producción
readinessProbe:
  httpGet:
    path: /_cluster/health?local=true
    port: 9200
    scheme: HTTP
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 12
  timeoutSeconds: 5

## Liveness probe - Sin autenticación
livenessProbe:
  httpGet:
    path: /_cluster/health?local=true
    port: 9200
    scheme: HTTP
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 5

## Startup probe - Sin autenticación
startupProbe:
  httpGet:
    path: /_cluster/health?local=true
    port: 9200
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30
