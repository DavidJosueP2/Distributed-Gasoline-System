## Global parameters
global:
  storageClass: "managed-csi"
  security:
    allowInsecureImages: true

## RabbitMQ Authentication
auth:
  username: admin
  password: "RabbitDev2024"
  erlangCookie: "deverlangcookie123456789012"

## Image - Usar imagen legacy gratuita
image:
  registry: docker.io
  repository: bitnamilegacy/rabbitmq
  tag: 3.13.7-debian-12-r4

## Clustering
replicaCount: 1

## Persistence
persistence:
  enabled: true
  storageClass: "managed-csi"
  accessMode: ReadWriteOnce
  size: 5Gi

## Volume Permissions - Requerido para imagen legacy
volumePermissions:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r50

## Resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

## Service Configuration
service:
  type: ClusterIP
  port: 5672
  managerPort: 15672

## Metrics
metrics:
  enabled: false
  serviceMonitor:
    enabled: false

## Plugins
plugins: "rabbitmq_management"

## Clustering configuration
clustering:
  enabled: false

## Network Policy
networkPolicy:
  enabled: false

## Pod Disruption Budget
pdb:
  create: false
