apiVersion: v2
name: fuel-system
description: Sistema Distribuido de Gestión de Combustible
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - fuel-system
  - microservices
  - nestjs
  - distributed-system
maintainers:
  - name: Fuel System Team
    email: team@fuelsystem.com
dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: rabbitmq
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  - name: elasticsearch
    version: 19.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled

