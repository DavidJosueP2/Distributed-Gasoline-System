{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuel-system.fullname" . }}-api-gateway
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  {{- if not .Values.apiGateway.autoscaling.enabled }}
  replicas: {{ .Values.apiGateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuel-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "fuel-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      {{- include "fuel-system.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: api-gateway
        image: "{{ .Values.imageRegistry.url }}/{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.apiGateway.service.targetPort }}
          protocol: TCP
        {{- if .Values.apiGateway.ssl.enabled }}
        - name: https
          containerPort: {{ .Values.apiGateway.ssl.port | default 8443 }}
          protocol: TCP
        {{- end }}
        env:
        - name: NODE_ENV
          value: {{ .Values.apiGateway.env.NODE_ENV | quote }}
        - name: PORT
          value: {{ .Values.apiGateway.env.PORT | quote }}

        # ========== SSL/TLS Configuration (Production Only) ==========
        {{- if .Values.apiGateway.ssl.enabled }}
        - name: SSL_ENABLED
          value: "true"
        - name: SSL_PORT
          value: {{ .Values.apiGateway.ssl.port | default 8443 | quote }}
        - name: SSL_CERT_PATH
          value: "/etc/ssl/certs/tls.crt"
        - name: SSL_KEY_PATH
          value: "/etc/ssl/certs/tls.key"
        {{- else }}
        - name: SSL_ENABLED
          value: "false"
        {{- end }}

        # ========== CRÍTICO: Variables de Service Discovery ==========
        - name: DISCOVERY_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: DISCOVERY_MODE
        - name: EUREKA_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_HOST
        - name: EUREKA_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_PORT
        - name: EUREKA_BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_BASE_PATH
        - name: EUREKA_WAIT_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_WAIT_TIMEOUT_MS
        - name: GATEWAY_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: GATEWAY_APP_NAME
        - name: GATEWAY_HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: GATEWAY_HTTP_PORT
        - name: GRPC_CALL_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: GRPC_CALL_TIMEOUT_MS
        - name: PROTO_ROOT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: PROTO_ROOT
        - name: PROTOS_DIR
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: PROTOS_DIR
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-jwt
              key: secret
        - name: JWT_EXPIRES_IN
          value: "1h"

        {{- if .Values.apiGateway.ssl.enabled }}
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        {{- end }}

        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 10 }}
      {{- if .Values.apiGateway.ssl.enabled }}
      volumes:
      - name: ssl-certs
        secret:
          secretName: {{ .Values.apiGateway.ssl.secretName | default "api-gateway-tls" }}
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuel-system.fullname" . }}-api-gateway
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
  - port: {{ .Values.apiGateway.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.apiGateway.service.type "NodePort") .Values.apiGateway.service.nodePort }}
    nodePort: {{ .Values.apiGateway.service.nodePort }}
    {{- end }}
  {{- if .Values.apiGateway.ssl.enabled }}
  - port: {{ .Values.apiGateway.ssl.servicePort | default 443 }}
    targetPort: https
    protocol: TCP
    name: https
    {{- if and (eq .Values.apiGateway.service.type "NodePort") .Values.apiGateway.ssl.nodePort }}
    nodePort: {{ .Values.apiGateway.ssl.nodePort }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "fuel-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
{{- if .Values.apiGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuel-system.fullname" . }}-api-gateway
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuel-system.fullname" . }}-api-gateway
  minReplicas: {{ .Values.apiGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.apiGateway.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.apiGateway.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.apiGateway.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.apiGateway.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
