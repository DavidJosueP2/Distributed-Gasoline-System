{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuel-system.fullname" . }}-auth-service
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  {{- if not .Values.authService.autoscaling.enabled }}
  replicas: {{ .Values.authService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuel-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        {{- include "fuel-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-service
    spec:
      {{- include "fuel-system.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: auth-service
        image: "{{ .Values.imageRegistry.url }}/{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.authService.service.targetPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.authService.env.NODE_ENV | quote }}
        - name: GRPC_PORT
          value: {{ .Values.authService.env.GRPC_PORT | quote }}
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: POSTGRESQL_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: password
        - name: DB_NAME
          value: {{ .Values.authService.env.DB_NAME | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-jwt
              key: secret
        - name: EUREKA_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_HOST
        - name: EUREKA_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_PORT
        resources:
          {{- toYaml .Values.authService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuel-system.fullname" . }}-auth-service
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  type: {{ .Values.authService.service.type }}
  ports:
  - port: {{ .Values.authService.service.port }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "fuel-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
{{- if .Values.authService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuel-system.fullname" . }}-auth-service
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuel-system.fullname" . }}-auth-service
  minReplicas: {{ .Values.authService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.authService.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.authService.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.authService.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}

