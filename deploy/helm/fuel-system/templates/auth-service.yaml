{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuel-system.fullname" . }}-auth-service
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  {{- if not .Values.authService.autoscaling.enabled }}
  replicas: {{ .Values.authService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuel-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        {{- include "fuel-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-service
    spec:
      {{- include "fuel-system.imagePullSecrets" . | nindent 6 }}
      # Init Container para esperar a que la base de datos esté disponible
      # Auth-service usa TypeORM con synchronize:true, no necesita SQL manual
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            set -e
            echo "🔄 Waiting for auth database to be ready..."
            for i in $(seq 1 30); do
              if PGPASSWORD="${AUTH_DB_PASS}" psql -h "${AUTH_DB_HOST}" -p "${AUTH_DB_PORT}" -U "${AUTH_DB_USER}" -d "${AUTH_DB_NAME}" -c '\q' 2>/dev/null; then
                echo "✅ Auth database is ready!"
                exit 0
              fi
              echo "⏳ Waiting for auth database... ($i/30)"
              sleep 2
            done
            echo "❌ ERROR: Auth database no disponible después de 60 segundos"
            exit 1
        env:
        - name: AUTH_DB_HOST
          {{- if .Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_HOST
          {{- else if .Values.postgresql.external.authHost }}
          value: {{ .Values.postgresql.external.authHost | quote }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_PORT
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: username
        - name: AUTH_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: password
        - name: AUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_NAME
      containers:
      - name: auth-service
        image: "{{ .Values.imageRegistry.url }}/{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.authService.service.targetPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.authService.env.NODE_ENV | quote }}
        - name: GRPC_PORT
          value: {{ .Values.authService.env.GRPC_PORT | quote }}
        - name: AUTH_GRPC_PORT
          value: {{ .Values.authService.env.AUTH_GRPC_PORT | quote }}

        # ========== CRÍTICO: Variables de Service Discovery ==========
        - name: DISCOVERY_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: DISCOVERY_MODE
        - name: EUREKA_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_HOST
        - name: EUREKA_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_PORT
        - name: EUREKA_BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_BASE_PATH
        - name: EUREKA_WAIT_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: EUREKA_WAIT_TIMEOUT_MS

        # Auth Service App Name
        - name: AUTH_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_APP_NAME

        # Variables de archivos .proto
        - name: PROTO_ROOT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: PROTO_ROOT
        - name: PROTOS_DIR
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: PROTOS_DIR
        # 🔑 CRÍTICO: Variable específica que eureka-register.ts busca PRIMERO
        - name: AUTH_SERVICE_REGISTER_HOST
          value: {{ include "fuel-system.fullname" . }}-auth-service
        - name: SERVICE_REGISTER_HOST
          value: {{ include "fuel-system.fullname" . }}-auth-service
        - name: REGISTER_HOST
          value: {{ include "fuel-system.fullname" . }}-auth-service
        - name: SERVICE_BIND_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: SERVICE_BIND_HOST
        # 🔑 CRÍTICO: Variable de fallback para bind en gRPC
        - name: BIND_HOST
          value: "0.0.0.0"

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-jwt
              key: secret
        - name: JWT_EXPIRES_IN
          value: "1h"

        # ========== Variables de Base de Datos (Auth DB) ==========
        - name: AUTH_DB_HOST
          {{- if .Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_HOST
          {{- else if .Values.postgresql.external.authHost }}
          value: {{ .Values.postgresql.external.authHost | quote }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_PORT
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: username
        - name: AUTH_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: password
        - name: AUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_NAME

        # Variables sin prefijo (para compatibilidad con TypeORM)
        # 🔑 CRÍTICO: Usar AUTH_DB_HOST del ConfigMap, no POSTGRESQL_HOST
        - name: DB_HOST
          {{- if .Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_HOST
          {{- else if .Values.postgresql.external.authHost }}
          value: {{ .Values.postgresql.external.authHost | quote }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" . }}-postgresql
              key: password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" . }}-config
              key: AUTH_DB_NAME
        - name: DB_SYNCHRONIZE
          value: "false"
        - name: DB_LOGGING
          value: "false"

        resources:
          {{- toYaml .Values.authService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuel-system.fullname" . }}-auth-service
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  type: {{ .Values.authService.service.type }}
  ports:
  - port: {{ .Values.authService.service.port }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "fuel-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
{{- if .Values.authService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuel-system.fullname" . }}-auth-service
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuel-system.fullname" . }}-auth-service
  minReplicas: {{ .Values.authService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.authService.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.authService.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.authService.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
