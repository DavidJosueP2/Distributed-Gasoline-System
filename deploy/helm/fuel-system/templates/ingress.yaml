{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fuel-system.fullname" . }}
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.ingress.useDefaultBackend }}
    # Regla sin host - para acceso directo por IP (Azure AKS o Kind local)
    - http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "fuel-system.fullname" $ }}-{{ .backend.service.name }}
                port:
                  number: {{ .backend.service.port }}
          {{- end }}
    {{- else }}
    # Reglas con host - para producción con dominio
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "fuel-system.fullname" $ }}-{{ .backend.service.name }}
                port:
                  number: {{ .backend.service.port }}
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
