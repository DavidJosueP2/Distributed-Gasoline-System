{{- range $serviceName, $config := list 
  (dict "name" "driver-service" "config" .Values.driverService "dbEnv" (dict "DB_NAME" .Values.driverService.env.DB_NAME) "needsDB" true "needsProtos" true "hasHttpPort" true "httpPort" .Values.driverService.env.DRIVER_HTTP_PORT "typeorm" true)
  (dict "name" "users-service" "config" .Values.usersService "prisma" true "needsDB" true "needsProtos" true)
  (dict "name" "vehicles-service" "config" .Values.vehiclesService "prisma" true "needsDB" true "needsProtos" true)
  (dict "name" "email-service" "config" .Values.emailService "smtp" true "needsProtos" true)
  (dict "name" "logger-service" "config" .Values.loggerService "elasticsearch" true "rabbitmq" true "hasHttpPort" true "httpPort" .Values.loggerService.env.LOGGER_HTTP_PORT)
  (dict "name" "publisher-service" "config" .Values.publisherService "rabbitmq" true "needsProtos" true "hasHttpPort" true "httpPort" .Values.publisherService.env.PORT)
}}
{{- if $config.config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  {{- if not (and $config.config.autoscaling $config.config.autoscaling.enabled) }}
  replicas: {{ $config.config.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuel-system.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $config.name }}
  template:
    metadata:
      labels:
        {{- include "fuel-system.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $config.name }}
    spec:
      {{- include "fuel-system.imagePullSecrets" $ | nindent 6 }}
      {{- if $config.prisma }}
      # Init Container para migraciones/seeding de Prisma
      initContainers:
      - name: prisma-migrate
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        {{- if eq $config.name "users-service" }}
        # Users-service: db push + seed automático
        command: ["sh", "-c", "npx prisma db push --accept-data-loss --skip-generate && node dist/prisma/seed.js"]
        {{- else }}
        # Otros servicios
        command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
        {{- end }}
        env:
        - name: NODE_ENV
          value: {{ $config.config.env.NODE_ENV | default "production" | quote }}
        {{- if $config.needsDB }}
        - name: DB_HOST
          {{- if eq $config.name "users-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: USERS_DB_HOST
            {{- else if $.Values.postgresql.external.usersHost }}
          value: {{ $.Values.postgresql.external.usersHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else if eq $config.name "vehicles-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: VEHICLES_DB_HOST
            {{- else if $.Values.postgresql.external.vehiclesHost }}
          value: {{ $.Values.postgresql.external.vehiclesHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        {{- end }}
        {{- $sslMode := $.Values.postgresql.external.sslMode | default "require" }}
        {{- if eq $config.name "users-service" }}
        - name: USERS_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/users_db?schema=public&sslmode={{ $sslMode }}"
        {{- else if eq $config.name "vehicles-service" }}
        - name: DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_db?schema=public&sslmode={{ $sslMode }}"
        - name: SHADOW_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_shadow_db?schema=public&sslmode={{ $sslMode }}"
        {{- end }}
      {{- end }}
      containers:
      - name: {{ $config.name }}
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ $config.config.service.targetPort }}
          protocol: TCP
        {{- if $config.hasHttpPort }}
        - name: http
          containerPort: {{ $config.httpPort }}
          protocol: TCP
        {{- end }}
        env:
        - name: NODE_ENV
          value: {{ $config.config.env.NODE_ENV | quote }}
        - name: GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}

        # ========== CRÍTICO: Variables de Service Discovery ==========
        - name: DISCOVERY_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DISCOVERY_MODE
        - name: EUREKA_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_HOST
        - name: EUREKA_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_PORT
        - name: EUREKA_BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_BASE_PATH
        - name: EUREKA_WAIT_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_WAIT_TIMEOUT_MS

        # Service Names for Eureka Registration (APP_NAME)
        {{- if eq $config.name "driver-service" }}
        - name: DRIVER_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_APP_NAME
        {{- else if eq $config.name "auth-service" }}
        - name: AUTH_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: AUTH_APP_NAME
        {{- else if eq $config.name "users-service" }}
        - name: USERS_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: USERS_APP_NAME
        {{- else if eq $config.name "vehicles-service" }}
        - name: VEHICLES_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: VEHICLES_APP_NAME
        {{- else if eq $config.name "email-service" }}
        - name: EMAIL_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EMAIL_APP_NAME
        {{- else if eq $config.name "logger-service" }}
        - name: LOGGER_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: LOGGER_APP_NAME
        {{- else if eq $config.name "publisher-service" }}
        - name: OUTBOX_PUBLISHER_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: OUTBOX_PUBLISHER_PORT
        {{- end }}

        {{- if $config.needsProtos }}
        - name: PROTO_ROOT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: PROTO_ROOT
        - name: PROTOS_DIR
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: PROTOS_DIR
        {{- end }}

        # Variables de registro en Eureka
        - name: SERVICE_REGISTER_HOST
          value: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
        - name: REGISTER_HOST
          value: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
        - name: SERVICE_BIND_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: SERVICE_BIND_HOST
        {{- if eq $config.name "driver-service" }}
        - name: DRIVER_HTTP_PORT
          value: {{ $config.config.env.DRIVER_HTTP_PORT | quote }}
        - name: DRIVER_GRPC_PORT
          value: {{ $config.config.env.DRIVER_GRPC_PORT | quote }}
        - name: BIND_HOST
          value: "0.0.0.0"
        - name: DRIVER_NODE_ENV
          value: {{ $config.config.env.NODE_ENV | quote }}
        - name: DRIVER_DB_HOST
          {{- if $.Values.postgresql.external.driverHost }}
          value: {{ $.Values.postgresql.external.driverHost | quote }}
          {{- else if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_HOST
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DRIVER_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_PORT
        - name: DRIVER_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DRIVER_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: DRIVER_DB_NAME
          value: {{ $config.config.env.DB_NAME | quote }}
        - name: DRIVER_DB_SYNCHRONIZE
          value: "false"
        - name: DRIVER_DB_LOGGING
          value: "false"
        {{- else if eq $config.name "users-service" }}
        - name: USERS_GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- else if eq $config.name "auth-service" }}
        - name: AUTH_GRPC_PORT
          value: {{ $config.config.env.AUTH_GRPC_PORT | quote }}
        - name: AUTH_DB_HOST
          {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: AUTH_DB_HOST
          {{- else if $.Values.postgresql.external.authHost }}
          value: {{ $.Values.postgresql.external.authHost | quote }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: AUTH_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: AUTH_DB
          value: {{ $config.config.env.DB_NAME | default "auth_db" | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-jwt
              key: secret
        - name: JWT_EXPIRES_IN
          value: "1h"
        {{- else if eq $config.name "vehicles-service" }}
        - name: VEHICLES_GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- else if eq $config.name "email-service" }}
        - name: EMAIL_GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- else if eq $config.name "logger-service" }}
        - name: LOGGER_HTTP_PORT
          value: {{ $config.config.env.LOGGER_HTTP_PORT | quote }}
        - name: LOGGER_GRPC_PORT
          value: {{ $config.config.env.LOGGER_GRPC_PORT | quote }}
        {{- else if eq $config.name "publisher-service" }}
        - name: PORT
          value: {{ $config.config.env.PORT | quote }}
        - name: OUTBOX_PUBLISHER_PORT
          value: {{ $config.config.env.OUTBOX_PUBLISHER_PORT | quote }}
        {{- end }}
        {{- if $config.needsDB }}
        - name: DB_HOST
          {{- if eq $config.name "driver-service" }}
            {{- if $.Values.postgresql.external.driverHost }}
          value: {{ $.Values.postgresql.external.driverHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else if eq $config.name "users-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: USERS_DB_HOST
            {{- else if $.Values.postgresql.external.usersHost }}
          value: {{ $.Values.postgresql.external.usersHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else if eq $config.name "vehicles-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: VEHICLES_DB_HOST
            {{- else if $.Values.postgresql.external.vehiclesHost }}
          value: {{ $.Values.postgresql.external.vehiclesHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        {{- end }}
        {{- if $config.dbEnv }}
        {{- range $key, $value := $config.dbEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- if $config.prisma }}
        {{- $sslMode := $.Values.postgresql.external.sslMode | default "require" }}
        {{- if eq $config.name "users-service" }}
        - name: USERS_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/users_db?schema=public&sslmode={{ $sslMode }}"
        {{- else if eq $config.name "vehicles-service" }}
        - name: DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_db?schema=public&sslmode={{ $sslMode }}"
        - name: SHADOW_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_shadow_db?schema=public&sslmode={{ $sslMode }}"
        {{- end }}
        {{- end }}
        {{- if $config.rabbitmq }}
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-rabbitmq
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-rabbitmq
              key: password
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
        {{- end }}
        {{- if $config.elasticsearch }}
        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ELASTICSEARCH_PORT
        - name: ELASTICSEARCH_NODE
          value: "http://$(ELASTICSEARCH_HOST):$(ELASTICSEARCH_PORT)"
        - name: ELASTICSEARCH_URL
          value: "http://$(ELASTICSEARCH_HOST):$(ELASTICSEARCH_PORT)"
        {{- end }}
        {{- if $config.smtp }}
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: host
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: port
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: user
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: password
        {{- end }}
        resources:
          {{- toYaml $config.config.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  type: {{ $config.config.service.type }}
  ports:
  - port: {{ $config.config.service.port }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "fuel-system.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
{{- if $config.config.autoscaling }}
{{- if $config.config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  minReplicas: {{ $config.config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.config.autoscaling.maxReplicas }}
  metrics:
  {{- if $config.config.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $config.config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
