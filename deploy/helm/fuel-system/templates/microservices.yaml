{{- range $serviceName, $config := list 
  (dict "name" "driver-service" "config" .Values.driverService "dbEnv" (dict "DB_NAME" .Values.driverService.env.DB_NAME) "needsDB" true)
  (dict "name" "users-service" "config" .Values.usersService "prisma" true "needsDB" true)
  (dict "name" "vehicles-service" "config" .Values.vehiclesService "prisma" true "needsDB" true)
  (dict "name" "email-service" "config" .Values.emailService "smtp" true)
  (dict "name" "hello-service" "config" .Values.helloService "rabbitmq" true)
  (dict "name" "logger-service" "config" .Values.loggerService "elasticsearch" true "rabbitmq" true)
  (dict "name" "publisher-service" "config" .Values.publisherService "rabbitmq" true)
}}
{{- if $config.config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  {{- if not $config.config.autoscaling.enabled }}
  replicas: {{ $config.config.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuel-system.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $config.name }}
  template:
    metadata:
      labels:
        {{- include "fuel-system.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $config.name }}
    spec:
      {{- include "fuel-system.imagePullSecrets" $ | nindent 6 }}
      {{- if $config.prisma }}
      # 🚀 Init Container para migraciones de Prisma
      initContainers:
      - name: prisma-migrate
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        command: ["sh", "-c", "npx prisma migrate deploy"]
        env:
        - name: NODE_ENV
          value: "production"
        {{- if $config.needsDB }}
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        {{- end }}
        {{- if eq $config.name "users-service" }}
        - name: USERS_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/users_db?schema=public&sslmode=require"
        {{- else if eq $config.name "vehicles-service" }}
        - name: DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_db?schema=public&sslmode=require"
        - name: SHADOW_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_shadow_db?schema=public&sslmode=require"
        {{- end }}
      {{- end }}
      containers:
      - name: {{ $config.name }}
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ $config.config.service.targetPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ $config.config.env.NODE_ENV | quote }}
        - name: GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- if $config.needsDB }}
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        {{- end }}
        {{- if $config.dbEnv }}
        {{- range $key, $value := $config.dbEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- if $config.prisma }}
        {{- if eq $config.name "users-service" }}
        - name: USERS_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/users_db?schema=public"
        {{- else if eq $config.name "vehicles-service" }}
        - name: DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_db?schema=public"
        - name: SHADOW_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_shadow_db?schema=public"
        {{- end }}
        {{- end }}
        {{- if $config.rabbitmq }}
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-rabbitmq
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-rabbitmq
              key: password
        {{- end }}
        {{- if $config.elasticsearch }}
        - name: ELASTICSEARCH_NODE
          value: "http://$(ELASTICSEARCH_HOST):$(ELASTICSEARCH_PORT)"
        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ELASTICSEARCH_PORT
        {{- end }}
        {{- if $config.smtp }}
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: host
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: port
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: user
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: password
        {{- end }}
        - name: EUREKA_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_HOST
        - name: EUREKA_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_PORT
        resources:
          {{- toYaml $config.config.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  type: {{ $config.config.service.type }}
  ports:
  - port: {{ $config.config.service.port }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "fuel-system.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
{{- if $config.config.autoscaling }}
{{- if $config.config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  minReplicas: {{ $config.config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.config.autoscaling.maxReplicas }}
  metrics:
  {{- if $config.config.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $config.config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

