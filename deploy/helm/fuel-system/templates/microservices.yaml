{{- range $serviceName, $config := list 
  (dict "name" "driver-service" "config" .Values.driverService "dbEnv" (dict "DB_NAME" .Values.driverService.env.DB_NAME) "needsDB" true "needsProtos" true "hasHttpPort" true "httpPort" .Values.driverService.env.DRIVER_HTTP_PORT "typeorm" true)
  (dict "name" "routes-service" "config" .Values.routesService "dbEnv" (dict "DB_NAME" .Values.routesService.env.DB_NAME) "needsDB" true "needsProtos" true "typeorm" true)
  (dict "name" "users-service" "config" .Values.usersService "prisma" true "needsDB" true "needsProtos" true)
  (dict "name" "vehicles-service" "config" .Values.vehiclesService "prisma" true "needsDB" true "needsProtos" true)
  (dict "name" "fuel-service" "config" .Values.fuelService "needsProtos" true)
  (dict "name" "email-service" "config" .Values.emailService "smtp" true "needsProtos" true)
  (dict "name" "logger-service" "config" .Values.loggerService "elasticsearch" true "rabbitmq" true "hasHttpPort" true "httpPort" .Values.loggerService.env.LOGGER_HTTP_PORT)
  (dict "name" "publisher-service" "config" .Values.publisherService "rabbitmq" true "needsProtos" true "hasHttpPort" true "httpPort" .Values.publisherService.env.PORT)
}}
{{- if $config.config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  {{- if not (and $config.config.autoscaling $config.config.autoscaling.enabled) }}
  replicas: {{ $config.config.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuel-system.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $config.name }}
  template:
    metadata:
      labels:
        {{- include "fuel-system.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $config.name }}
    spec:
      {{- include "fuel-system.imagePullSecrets" $ | nindent 6 }}
      {{- if $config.prisma }}
      # Init Container para migraciones/seeding de Prisma
      initContainers:
      - name: prisma-migrate
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        {{- if eq $config.name "users-service" }}
        # Users-service: db push + seed automático
        command: ["sh", "-c", "npx prisma db push --accept-data-loss --skip-generate && node dist/prisma/seed.js"]
        {{- else }}
        # Otros servicios
        command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
        {{- end }}
        env:
        - name: NODE_ENV
          value: {{ $config.config.env.NODE_ENV | default "production" | quote }}
        {{- if $config.needsDB }}
        - name: DB_HOST
          {{- if eq $config.name "users-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: USERS_DB_HOST
            {{- else if $.Values.postgresql.external.usersHost }}
          value: {{ $.Values.postgresql.external.usersHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else if eq $config.name "vehicles-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: VEHICLES_DB_HOST
            {{- else if $.Values.postgresql.external.vehiclesHost }}
          value: {{ $.Values.postgresql.external.vehiclesHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        {{- end }}
        {{- $sslMode := $.Values.postgresql.external.sslMode | default "require" }}
        {{- if eq $config.name "users-service" }}
        - name: USERS_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/users_db?schema=public&sslmode={{ $sslMode }}"
        {{- else if eq $config.name "vehicles-service" }}
        - name: DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_db?schema=public&sslmode={{ $sslMode }}"
        - name: SHADOW_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_shadow_db?schema=public&sslmode={{ $sslMode }}"
        {{- end }}
      {{- end }}
      {{- if $config.typeorm }}
      # Init Container para migraciones/seeding de TypeORM (driver-service y routes-service)
      initContainers:
      - name: typeorm-migrate
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        command:
          - sh
          - -c
          - |
            set -e
            echo "🔄 Waiting for database to be ready..."
            {{- $sslMode := $.Values.postgresql.external.sslMode | default "disable" }}
            for i in $(seq 1 30); do
              {{- if eq $sslMode "require" }}
              if PGPASSWORD="${DB_PASS}" psql "sslmode=require host=${DB_HOST} port=${DB_PORT} user=${DB_USER} dbname=${DB_NAME}" -c '\q' 2>/dev/null; then
              {{- else }}
              if PGPASSWORD="${DB_PASS}" psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -c '\q' 2>/dev/null; then
              {{- end }}
                echo "✅ Database is ready!"
                break
              fi
              echo "⏳ Waiting for database... ($i/30)"
              sleep 2
            done

            {{- if eq $config.name "driver-service" }}
            # Driver Service: init.sql en raíz + migrations/ + seed.sql
            echo "🔄 Ejecutando init.sql para crear tablas..."
            if [ -f /app/init.sql ]; then
              {{- if eq $sslMode "require" }}
              PGPASSWORD="${DB_PASS}" psql "sslmode=require host=${DB_HOST} port=${DB_PORT} user=${DB_USER} dbname=${DB_NAME}" \
              {{- else }}
              PGPASSWORD="${DB_PASS}" psql \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
              {{- end }}
                -v ON_ERROR_STOP=1 \
                -f /app/init.sql
              echo "✅ init.sql ejecutado correctamente"
            else
              echo "❌ ERROR: /app/init.sql no encontrado"
              exit 1
            fi

            echo "🔄 Ejecutando migraciones SQL adicionales..."
            if [ -d /app/migrations ]; then
              for migration in /app/migrations/*.sql; do
                if [ -f "$migration" ]; then
                  echo "Aplicando: $migration"
                  {{- if eq $sslMode "require" }}
                  PGPASSWORD="${DB_PASS}" psql "sslmode=require host=${DB_HOST} port=${DB_PORT} user=${DB_USER} dbname=${DB_NAME}" \
                  {{- else }}
                  PGPASSWORD="${DB_PASS}" psql \
                    -h "${DB_HOST}" \
                    -p "${DB_PORT}" \
                    -U "${DB_USER}" \
                    -d "${DB_NAME}" \
                  {{- end }}
                    -f "$migration" || echo "⚠️ Error en $migration (puede ser normal si ya está aplicada)"
                fi
              done
              echo "✅ Migraciones completadas"
            else
              echo "⚠️ No se encontró el directorio /app/migrations"
            fi

            echo "🌱 Ejecutando seed.sql..."
            if [ -f /app/seed.sql ]; then
              PGPASSWORD="${DB_PASS}" psql \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f /app/seed.sql
              echo "✅ seed.sql ejecutado correctamente"
            else
              echo "❌ ERROR: /app/seed.sql no encontrado"
              exit 1
            fi
            {{- else if eq $config.name "routes-service" }}
            # Routes Service: db/init.sql (incluye seeding integrado)
            echo "🔄 Ejecutando db/init.sql (schema + seeding)..."
            if [ -f /app/db/init.sql ]; then
              PGPASSWORD="${DB_PASS}" psql \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -v ON_ERROR_STOP=1 \
                -f /app/db/init.sql
              echo "✅ db/init.sql ejecutado correctamente (schema + seeding completado)"
            else
              echo "❌ ERROR: /app/db/init.sql no encontrado"
              exit 1
            fi
            {{- end }}

            echo "✅ Inicialización de base de datos completada!"
        env:
        {{- if eq $config.name "driver-service" }}
        # Variables para Driver Service
        - name: DB_HOST
          {{- if $.Values.postgresql.external.driverHost }}
          value: {{ $.Values.postgresql.external.driverHost | quote }}
          {{- else if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_HOST
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_NAME
        - name: DRIVER_DB_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_SSL_MODE
        {{- else if eq $config.name "routes-service" }}
        # Variables para Routes Service
        - name: DB_HOST
          {{- if $.Values.postgresql.external.routesHost }}
          value: {{ $.Values.postgresql.external.routesHost | quote }}
          {{- else if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ROUTES_DB_HOST
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ROUTES_DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ROUTES_DB_NAME
        {{- end }}
      {{- end }}
      containers:
      - name: {{ $config.name }}
        image: "{{ $.Values.imageRegistry.url }}/{{ $config.config.image.repository }}:{{ $config.config.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $config.config.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ $config.config.service.targetPort }}
          protocol: TCP
        {{- if $config.hasHttpPort }}
        - name: http
          containerPort: {{ $config.httpPort }}
          protocol: TCP
        {{- end }}
        env:
        - name: NODE_ENV
          value: {{ $config.config.env.NODE_ENV | quote }}
        - name: GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}

        # ========== CRÍTICO: Variables de Service Discovery ==========
        - name: DISCOVERY_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DISCOVERY_MODE
        - name: EUREKA_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_HOST
        - name: EUREKA_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_PORT
        - name: EUREKA_BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_BASE_PATH
        - name: EUREKA_WAIT_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EUREKA_WAIT_TIMEOUT_MS

        # Service Names for Eureka Registration (APP_NAME)
        {{- if eq $config.name "driver-service" }}
        - name: DRIVER_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_APP_NAME
        {{- else if eq $config.name "auth-service" }}
        - name: AUTH_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: AUTH_APP_NAME
        {{- else if eq $config.name "users-service" }}
        - name: USERS_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: USERS_APP_NAME
        {{- else if eq $config.name "vehicles-service" }}
        - name: VEHICLES_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: VEHICLES_APP_NAME
        {{- else if eq $config.name "email-service" }}
        - name: EMAIL_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: EMAIL_APP_NAME
        {{- else if eq $config.name "logger-service" }}
        - name: LOGGER_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: LOGGER_APP_NAME
        {{- else if eq $config.name "routes-service" }}
        - name: ROUTES_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ROUTES_APP_NAME
        {{- else if eq $config.name "publisher-service" }}
        - name: OUTBOX_PUBLISHER_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: OUTBOX_PUBLISHER_PORT
        {{- end }}

        {{- if $config.needsProtos }}
        - name: PROTO_ROOT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: PROTO_ROOT
        - name: PROTOS_DIR
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: PROTOS_DIR
        {{- end }}

        # JWT Configuration (para validación de tokens en todos los microservicios)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-jwt
              key: secret
        - name: JWT_EXPIRES_IN
          value: "1h"

        # Variables de registro en Eureka
        - name: SERVICE_REGISTER_HOST
          value: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
        - name: REGISTER_HOST
          value: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
        - name: SERVICE_BIND_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: SERVICE_BIND_HOST
        {{- if eq $config.name "driver-service" }}
        - name: DRIVER_HTTP_PORT
          value: {{ $config.config.env.DRIVER_HTTP_PORT | quote }}
        - name: DRIVER_GRPC_PORT
          value: {{ $config.config.env.DRIVER_GRPC_PORT | quote }}
        - name: BIND_HOST
          value: "0.0.0.0"
        - name: DRIVER_NODE_ENV
          value: {{ $config.config.env.NODE_ENV | quote }}
        - name: DRIVER_DB_HOST
          {{- if $.Values.postgresql.external.driverHost }}
          value: {{ $.Values.postgresql.external.driverHost | quote }}
          {{- else if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_HOST
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DRIVER_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_PORT
        - name: DRIVER_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DRIVER_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: DRIVER_DB_NAME
          value: {{ $config.config.env.DB_NAME | quote }}
        - name: DRIVER_DB_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: DRIVER_DB_SSL_MODE
        - name: DRIVER_DB_SYNCHRONIZE
          value: "false"
        - name: DRIVER_DB_LOGGING
          value: "false"
        {{- else if eq $config.name "users-service" }}
        - name: USERS_GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- else if eq $config.name "auth-service" }}
        - name: AUTH_GRPC_PORT
          value: {{ $config.config.env.AUTH_GRPC_PORT | quote }}
        - name: AUTH_DB_HOST
          {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: AUTH_DB_HOST
          {{- else if $.Values.postgresql.external.authHost }}
          value: {{ $.Values.postgresql.external.authHost | quote }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: AUTH_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: AUTH_DB
          value: {{ $config.config.env.DB_NAME | default "auth_db" | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-jwt
              key: secret
        - name: JWT_EXPIRES_IN
          value: "1h"
        {{- else if eq $config.name "vehicles-service" }}
        - name: VEHICLES_GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- else if eq $config.name "fuel-service" }}
        - name: FUEL_GRPC_PORT
          value: {{ $config.config.env.FUEL_GRPC_PORT | quote }}
        - name: FUEL_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: FUEL_APP_NAME
        - name: FUEL_SERVICE_REGISTER_HOST
          value: {{ include "fuel-system.fullname" $ }}-fuel-service
        {{- else if eq $config.name "email-service" }}
        - name: EMAIL_GRPC_PORT
          value: {{ $config.config.env.GRPC_PORT | quote }}
        {{- else if eq $config.name "logger-service" }}
        - name: LOGGER_HTTP_PORT
          value: {{ $config.config.env.LOGGER_HTTP_PORT | quote }}
        - name: LOGGER_GRPC_PORT
          value: {{ $config.config.env.LOGGER_GRPC_PORT | quote }}
        {{- else if eq $config.name "routes-service" }}
        - name: ROUTES_GRPC_PORT
          value: {{ $config.config.env.ROUTES_GRPC_PORT | quote }}
        - name: BIND_HOST
          value: "0.0.0.0"
        - name: ROUTES_DB_HOST
          {{- if $.Values.postgresql.external.routesHost }}
          value: {{ $.Values.postgresql.external.routesHost | quote }}
          {{- else if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ROUTES_DB_HOST
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: ROUTES_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ROUTES_DB_PORT
        - name: ROUTES_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: ROUTES_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        - name: ROUTES_DB_NAME
          value: {{ $config.config.env.DB_NAME | quote }}
        - name: ROUTES_DB_SSL_MODE
          value: {{ $.Values.postgresql.external.sslMode | default "disable" | quote }}
        - name: DB_SSL_REJECT_UNAUTHORIZED
          value: {{ $.Values.postgresql.external.sslRejectUnauthorized | default "false" | quote }}
        {{- else if eq $config.name "publisher-service" }}
        - name: PORT
          value: {{ $config.config.env.PORT | quote }}
        - name: OUTBOX_PUBLISHER_PORT
          value: {{ $config.config.env.OUTBOX_PUBLISHER_PORT | quote }}
        {{- end }}
        {{- if $config.needsDB }}
        - name: DB_HOST
          {{- if eq $config.name "driver-service" }}
            {{- if $.Values.postgresql.external.driverHost }}
          value: {{ $.Values.postgresql.external.driverHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else if eq $config.name "users-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: USERS_DB_HOST
            {{- else if $.Values.postgresql.external.usersHost }}
          value: {{ $.Values.postgresql.external.usersHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else if eq $config.name "vehicles-service" }}
            {{- if $.Values.postgresql.external.hosts }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: VEHICLES_DB_HOST
            {{- else if $.Values.postgresql.external.vehiclesHost }}
          value: {{ $.Values.postgresql.external.vehiclesHost | quote }}
            {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
            {{- end }}
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_HOST
          {{- end }}
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: POSTGRESQL_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-postgresql
              key: password
        {{- end }}
        {{- if $config.dbEnv }}
        {{- range $key, $value := $config.dbEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- if $config.prisma }}
        {{- $sslMode := $.Values.postgresql.external.sslMode | default "require" }}
        {{- if eq $config.name "users-service" }}
        - name: USERS_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/users_db?schema=public&sslmode={{ $sslMode }}"
        {{- else if eq $config.name "vehicles-service" }}
        - name: DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_db?schema=public&sslmode={{ $sslMode }}"
        - name: SHADOW_DATABASE_URL
          value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/vehicles_shadow_db?schema=public&sslmode={{ $sslMode }}"
        {{- end }}
        {{- end }}
        {{- if $config.rabbitmq }}
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-rabbitmq
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-rabbitmq
              key: password
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
        {{- end }}
        {{- if $config.elasticsearch }}
        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: ELASTICSEARCH_PORT
        - name: ELASTICSEARCH_NODE
          value: "http://$(ELASTICSEARCH_HOST):$(ELASTICSEARCH_PORT)"
        - name: ELASTICSEARCH_URL
          value: "http://$(ELASTICSEARCH_HOST):$(ELASTICSEARCH_PORT)"
        {{- end }}
        {{- if $config.smtp }}
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: host
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: port
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: user
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-smtp
              key: password
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "fuel-system.fullname" $ }}-config
              key: FRONTEND_URL
        {{- end }}
        resources:
          {{- toYaml $config.config.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  type: {{ $config.config.service.type }}
  ports:
  - port: {{ $config.config.service.port }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "fuel-system.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
{{- if $config.config.autoscaling }}
{{- if $config.config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  labels:
    {{- include "fuel-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuel-system.fullname" $ }}-{{ $config.name }}
  minReplicas: {{ $config.config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.config.autoscaling.maxReplicas }}
  metrics:
  {{- if $config.config.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $config.config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
