{{- end }}

---
{{/* ======================== JWT ========================= */}}
{{- $jwtName := printf "%s-jwt" (include "fuel-system.fullname" .) -}}
{{- $jwtExisting := (lookup "v1" "Secret" .Release.Namespace $jwtName) -}}
{{- if not $jwtExisting }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $jwtName }}
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ .Values.secrets.jwt.secret | b64enc | quote }}
{{- end }}

---
{{/* ======================== SMTP ======================== */}}
{{- $smtpName := printf "%s-smtp" (include "fuel-system.fullname" .) -}}
{{- $smtpExisting := (lookup "v1" "Secret" .Release.Namespace $smtpName) -}}
{{- if not $smtpExisting }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $smtpName }}
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
type: Opaque
data:
  host: {{ .Values.secrets.smtp.host | b64enc | quote }}
  port: {{ .Values.secrets.smtp.port | toString | b64enc | quote }}
  user: {{ .Values.secrets.smtp.user | b64enc | quote }}
  password: {{ .Values.secrets.smtp.password | b64enc | quote }}
{{- end }}
