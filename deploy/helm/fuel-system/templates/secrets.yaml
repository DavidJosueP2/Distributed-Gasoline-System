{{/* ===================== PostgreSQL ===================== */}}
{{- if not .Values.postgresql.enabled }}
{{- $pgName := printf "%s-postgresql" (include "fuel-system.fullname" .) -}}
{{- $pgExisting := (lookup "v1" "Secret" .Release.Namespace $pgName) -}}
{{- if not $pgExisting }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "fuel-system.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.postgresql.username | b64enc | quote }}
  password: {{ .Values.secrets.postgresql.password | b64enc | quote }}
{{- end }}
{{- end }}

---
{{/* ====================== RabbitMQ ====================== */}}
{{- if not .Values.rabbitmq.enabled }}
{{- $rmqName := printf "%s-rabbitmq" (include "fuel-system.fullname" .) -}}
{{- $rmqExisting := (lookup "v1" "Secret" .Release.Namespace $rmqName) -}}
{{- if not $rmqExisting }}
apiVersion: v1
