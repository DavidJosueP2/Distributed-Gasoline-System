    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# Hello Service
helloService:
  enabled: true
  replicaCount: 1
  image:
    repository: hello-svc
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50051
    targetPort: 50051
  env:
    NODE_ENV: production
    GRPC_PORT: 50051
    HELLO_GRPC_PORT: 50051
