    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Email Service
emailService:
  enabled: true
  replicaCount: 2
  image:
    repository: email-svc
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50053
    targetPort: 50053
  env:
    NODE_ENV: production
    GRPC_PORT: 50053
    EMAIL_GRPC_PORT: 50053
