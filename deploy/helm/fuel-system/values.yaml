    port: 50054
    targetPort: 50054
  env:
    NODE_ENV: production
    GRPC_PORT: 50054
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
