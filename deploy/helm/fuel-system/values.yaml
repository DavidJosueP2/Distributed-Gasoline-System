    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# Hello Service
helloService:
  enabled: true
  replicaCount: 1
  image:
    repository: fuel-system/hello-svc
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50056
    targetPort: 50056
  env:
    NODE_ENV: production
    GRPC_PORT: 50056
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# Logger Service
