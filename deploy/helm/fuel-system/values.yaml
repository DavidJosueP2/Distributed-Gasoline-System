# ==============================================
# FUEL SYSTEM - Helm Values Configuration
# ==============================================

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  # Tag global para todas las imágenes (se puede sobrescribir por servicio)
  imageTag: "latest"
  # Node environment (production, development, staging)
  nodeEnv: "production"

# Image registry configuration for GitHub Container Registry (GHCR)
# NOTA: El URL base apunta al registry, los repositorios individuales se especifican en cada servicio
imageRegistry:
  url: "ghcr.io/davidjosuep2/distributed-gasoline-system/fuel-system"
  username: ""
  password: ""

# Common labels
commonLabels:
  app.kubernetes.io/part-of: fuel-system
  app.kubernetes.io/managed-by: helm

# ==============================================
# INFRASTRUCTURE SERVICES
# ==============================================

# PostgreSQL Configuration
# NOTA: Se instalan como releases externos separados (ver kind-fuel-local.md)
# auth-db, driver-db, users-db, vehicles-db, vehicles-shadow-db
postgresql:
  enabled: false  # Deshabilitado - se instalan como releases separados
  external:
    enabled: true
    # En local: <release-name>-postgresql (ej: auth-db-postgresql)
    # En Azure: fuel-system-postgres.postgres.database.azure.com
    hosts:
      auth: "auth-db-postgresql"
      driver: "driver-db-postgresql"
      users: "users-db-postgresql"
      vehicles: "vehicles-db-postgresql"
      vehiclesShadow: "vehicles-shadow-db-postgresql"
    port: 5432
    username: "postgres"
    password: "root"  # Se sobreescribe en producción vía secret
    sslMode: "disable"  # En local. En Azure: "require"
    databases:
      auth: "auth_db"
      driver: "driver_db"
      users: "users_db"
      vehicles: "vehicles_db"
      vehiclesShadow: "vehicles_shadow_db"

# RabbitMQ Configuration
# NOTA: Se instala como release externo separado (ver kind-fuel-local.md)
rabbitmq:
  enabled: false  # Deshabilitado - se instala como release separado
  external:
    enabled: true
    # En local: rabbitmq (nombre del release)
    # En Azure: rabbitmq service en AKS
    host: "rabbitmq"
    port: 5672
    managementPort: 15672
    username: "admin"
    password: "admin123"  # Se sobreescribe en producción

# Elasticsearch Configuration
# NOTA: Se instala como release externo separado (ver kind-fuel-local.md)
elasticsearch:
  enabled: false  # Deshabilitado - se instala como release separado
  external:
    enabled: true
    # En local: elasticsearch-master (nombre del servicio)
    # En Azure: elasticsearch service en AKS
    host: "elasticsearch-master"
    port: 9200
    scheme: "http"  # En producción: "https"

# Eureka Server Configuration
eurekaServer:
  enabled: true
  image:
    repository: steeltoeoss/eureka-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8761
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# ==============================================
# MICROSERVICES
# ==============================================

# API Gateway
apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: api-gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8080
    targetPort: 8080
  env:
    NODE_ENV: production
    PORT: 8080
    GATEWAY_HTTP_PORT: 8080
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Auth Service
authService:
  enabled: true
  replicaCount: 2
  image:
    repository: auth-svc
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50052
    targetPort: 50052
  env:
    NODE_ENV: production
    GRPC_PORT: 50052
    AUTH_GRPC_PORT: 50052
    DB_NAME: auth_db
  database:
    enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Driver Service
driverService:
  enabled: true
  replicaCount: 2
  image:
    repository: driver-ms
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50062
    targetPort: 50062
  env:
    NODE_ENV: production
    GRPC_PORT: 50062
    DRIVER_GRPC_PORT: 50062
    DRIVER_HTTP_PORT: 3100
    DB_NAME: driver_db
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Users Service
usersService:
  enabled: true
  replicaCount: 2
  image:
    repository: users-srv
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50057
    targetPort: 50057
  env:
    NODE_ENV: production
    GRPC_PORT: 50057
    USERS_GRPC_PORT: 50057
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
