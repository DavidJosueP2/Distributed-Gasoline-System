# ==============================================
# SECRETS & CONFIGMAPS
# ==============================================

secrets:
  postgresql:
    username: postgres
    password: postgres
  rabbitmq:
    username: admin
    password: admin123
  jwt:
    secret: your-super-secret-jwt-key-change-in-production
  smtp:
    host: smtp.gmail.com
    port: 587
    user: your-email@gmail.com
    password: your-app-password

# ==============================================
# INGRESS
# ==============================================

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: fuel-system.example.com
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: api-gateway
              port: 8080
  tls:
    - secretName: fuel-system-tls
      hosts:
        - fuel-system.example.com

# ==============================================
# MONITORING & OBSERVABILITY
# ==============================================

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true

# ==============================================
# BACKUP & DISASTER RECOVERY
# ==============================================

backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7

