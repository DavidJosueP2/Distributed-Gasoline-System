    type: ClusterIP
    port: 50055
    targetPort: 50055
  env:
    NODE_ENV: production
    GRPC_PORT: 50055
    VEHICLES_GRPC_PORT: 50055
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
