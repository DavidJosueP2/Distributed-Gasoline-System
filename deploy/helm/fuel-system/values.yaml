  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Users Service
usersService:
  enabled: true
  replicaCount: 2
  image:
    repository: fuel-system/users-srv
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50053
    targetPort: 50053
  env:
    NODE_ENV: production
    GRPC_PORT: 50053
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Vehicles Service
