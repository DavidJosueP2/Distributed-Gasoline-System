    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Fuel Service (Orchestration/Aggregation Service - NO database)
fuelService:
  enabled: true
  replicaCount: 2
  image:
    repository: fuel-svc
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50054
    targetPort: 50054
  env:
    NODE_ENV: production
    GRPC_PORT: 50054
    FUEL_GRPC_PORT: 50054
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ==============================================
# SECRETS & CONFIGMAPS
# ==============================================

secrets:
  postgresql:
    username: pgadmin
    password: ""  # Configurar en el deploy
  rabbitmq:
    username: admin
    password: ""  # Configurar en el deploy
  jwt:
    secret: ""  # Configurar en el deploy - IMPORTANTE: Cambiar en producción
  smtp:
    host: smtp.gmail.com
    port: 587
    user: ""  # Configurar en el deploy
    password: ""  # Configurar en el deploy

# ==============================================
# INGRESS
# ==============================================

ingress:
  enabled: true
  className: nginx
  # Usar regla sin host para acceso directo por IP (útil en Azure AKS sin dominio)
  # En local se sobreescribe en values-local.yaml
  useDefaultBackend: false  # true = acceso por IP, false = acceso por dominio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # Configuración para acceso SIN dominio (por IP directa)
  paths:
    - path: /
      pathType: Prefix
      backend:
        service:
          name: api-gateway
          port: 8080
  # Configuración para acceso CON dominio
  hosts:
    - host: fuel-system.example.com  # Actualizar con tu dominio
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: api-gateway
              port: 8080
  tls:
    - secretName: fuel-system-tls
      hosts:
        - fuel-system.example.com

# ==============================================
# MONITORING & OBSERVABILITY
# ==============================================

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true

# ==============================================
# BACKUP & DISASTER RECOVERY
# ==============================================

backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7
