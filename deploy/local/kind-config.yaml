kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fuel-local
nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "ingress-ready=true"
    extraPortMappings:
    # API Gateway
    - containerPort: 30000
      hostPort: 3000
      protocol: TCP
    # Eureka Server
    - containerPort: 30761
      hostPort: 8761
      protocol: TCP
    # RabbitMQ Management
    - containerPort: 31672
      hostPort: 15672
      protocol: TCP
    # Elasticsearch
    - containerPort: 30920
      hostPort: 9200
      protocol: TCP

  # Worker node 1
  - role: worker

  # Worker node 2
  - role: worker
