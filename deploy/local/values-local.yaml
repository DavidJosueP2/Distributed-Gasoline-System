# Publisher Service
publisherService:
  enabled: true
  replicaCount: 1
  image:
    repository: "publisher-rabbit-srv"
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 4100
    targetPort: 4100
  env:
    NODE_ENV: "development"
    GRPC_PORT: "4100"
    PORT: "4100"
    OUTBOX_PUBLISHER_PORT: "4100"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  autoscaling:
    enabled: false

routesService:
  enabled: true
  replicaCount: 1
  image:
    repository: "routes-srv"
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 50056
    targetPort: 50056
  env:
    NODE_ENV: "development"
    GRPC_PORT: "50056"
    ROUTES_GRPC_PORT: "50056"
    DB_NAME: "routes_db"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: false

# Ingress - Configurado para acceso local sin dominio
ingress:
  enabled: true
  className: nginx
  useDefaultBackend: true  # Usar regla sin host para acceso directo por IP
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"  # No forzar HTTPS en local
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  paths:
    - path: /
      pathType: Prefix
      backend:
        service:
          name: api-gateway
          port: 8080
  # hosts y tls deshabilitados para local
  hosts: []
  tls: []
