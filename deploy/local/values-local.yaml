# ==============================================
# VALUES PARA KUBERNETES LOCAL
# ==============================================
# Sobrescribe los valores de values.yaml para entorno local

# Global configuration para local
global:
  imageRegistry: ""
  imagePullSecrets: []  # Las imágenes son públicas, no necesitamos secret
  storageClass: "standard"  # Local usa standard storage class
  imageTag: "latest"
  nodeEnv: "development"  # Ambiente de desarrollo en local

# Image registry configuration
imageRegistry:
  url: "ghcr.io/davidjosuep2/distributed-gasoline-system/fuel-system"

# PostgreSQL Configuration - DESHABILITADO (usamos Helm charts separados)
postgresql:
  enabled: false
  external:
    enabled: true
    # Los hosts apuntan a los servicios de PostgreSQL desplegados por Helm separadamente
    # Cada microservicio se conectará a su propia base de datos
    hosts:
      auth: "auth-db-postgresql"
      driver: "driver-db-postgresql"
      users: "users-db-postgresql"
      vehicles: "vehicles-db-postgresql"
      vehiclesShadow: "vehicles-shadow-db-postgresql"
      routes: "routes-db-postgresql"
    port: 5432
    username: "postgres"
    password: "root"
    sslMode: "disable"  # En local no necesitamos SSL
    databases:
      auth: "auth_db"
      driver: "driver_db"
      users: "users_db"
      vehicles: "vehicles_db"
      vehiclesShadow: "vehicles_shadow_db"
      routes: "routes_db"

# RabbitMQ Configuration - DESHABILITADO (usamos Helm chart separado)
rabbitmq:
  enabled: false
  external:
    enabled: true
    host: "rabbitmq.fuel-system.svc.cluster.local"
    port: 5672
    username: "admin"
    password: "admin123"
    managementPort: 15672

# Elasticsearch Configuration - DESHABILITADO (usamos Helm chart separado)
elasticsearch:
  enabled: false
  external:
    enabled: true
    host: "elasticsearch-master.fuel-system.svc.cluster.local"
    port: 9200

# Eureka Server Configuration - DESHABILITADO (deployment manual)
eurekaServer:
  enabled: false
  external:
    enabled: true
    host: "eureka-server"
    port: 8761
    url: "http://eureka-server:8761/eureka"

# ==============================================
# MICROSERVICES CONFIGURATION - LOCAL
# ==============================================

# Secrets para local
secrets:
  postgresql:
    username: "postgres"
    password: "root"
  rabbitmq:
    username: "admin"
    password: "admin123"
  jwt:
    secret: "your-super-secret-jwt-key-change-in-production-12345"
  smtp:
    host: "smtp.gmail.com"
    port: 587
    user: ""
    password: ""

# API Gateway
apiGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: "api-gateway"
    tag: "latest"
    pullPolicy: Always
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30000
  env:
    NODE_ENV: "development"
    PORT: "8080"
    GATEWAY_HTTP_PORT: "8080"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: false

# Auth Service
authService:
  enabled: true
  replicaCount: 1
  image:
    repository: "auth-svc"
    tag: "latest"
    pullPolicy: Always  # Cambiado a Always para forzar descarga de la nueva imagen
  service:
    type: ClusterIP
    port: 50052
    targetPort: 50052
  env:
    NODE_ENV: "development"
    GRPC_PORT: "50052"
    AUTH_GRPC_PORT: "50052"
    DB_NAME: "auth_db"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: false

# Driver Service
driverService:
  enabled: true
  replicaCount: 1
  image:
    repository: "driver-ms"
    tag: "latest"
    pullPolicy: Always  # Cambiado a Always para forzar uso de nueva imagen local
  service:
    type: ClusterIP
    port: 50062
    targetPort: 50062
  env:
    NODE_ENV: "development"
    GRPC_PORT: "50062"
    DRIVER_GRPC_PORT: "50062"
    DRIVER_HTTP_PORT: "3100"
    DB_NAME: "driver_db"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: false

# Users Service
usersService:
  enabled: true
  replicaCount: 1
  image:
    repository: "users-srv"
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 50057
    targetPort: 50057
  env:
    NODE_ENV: "development"
    GRPC_PORT: "50057"
    USERS_GRPC_PORT: "50057"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
