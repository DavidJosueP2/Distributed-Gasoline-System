# Hello Service (opcional, para testing)
helloService:
  enabled: false
  replicaCount: 1
  image:
    repository: "hello-svc"
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 50051
    targetPort: 50051
  env:
    NODE_ENV: "development"
    GRPC_PORT: "50051"
    HELLO_GRPC_PORT: "50051"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Logger Service
loggerService:
  enabled: true
  replicaCount: 1
  image:
    repository: "logger-svc"
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 50058
    targetPort: 50058
  env:
    NODE_ENV: "development"
    GRPC_PORT: "50058"
    LOGGER_GRPC_PORT: "50058"
    LOGGER_HTTP_PORT: "3200"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
