syntax = "proto3";

package auth;

message Empty {}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  string expires_in = 3;
}

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc JustForTest (Empty) returns (Empty);
}
