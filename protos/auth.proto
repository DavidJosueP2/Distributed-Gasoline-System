syntax = "proto3";

package auth;

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc JustForTest (Empty) returns (Empty);
  rpc RecoverPassword (PasswordRecoveryRequest) returns (PasswordRecoveryResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse); 
  rpc Me (Empty) returns (UserResponse); 
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  string expires_in = 3;
}

message Empty {}

message PasswordRecoveryRequest {
  string email = 1;
}

message PasswordRecoveryResponse {
  bool success = 2;
  string message = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

message UserResponse {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string username = 6;
  repeated string roles = 7;
}