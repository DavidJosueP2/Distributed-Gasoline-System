syntax = "proto3";

package fuel;

service FuelService {
  rpc GetFuel(GetFuelRequest) returns (GetFuelResponse);
  rpc GenerateGeneralReport(GenerateGeneralReportRequest)
      returns (GenerateGeneralReportResponse);
  rpc GenerateVehicleDetailReport(GenerateVehicleDetailReportRequest)
      returns (GenerateVehicleDetailReportResponse);
  rpc GenerateVehicleRoutesReport(GenerateVehicleRoutesReportRequest)
      returns (GenerateVehicleRoutesReportResponse);
  rpc GenerateKPIs(GenerateKPIsRequest) returns (GenerateKPIsResponse);
  rpc GenerateDriverRankingReport(GenerateDriverRankingReportRequest)
      returns (GenerateDriverRankingReportResponse);
  rpc GetDriverTrips(GetDriverTripsRequest) returns (GetDriverTripsResponse);
  rpc GenerateRoutesSummaryReport(GenerateRoutesSummaryReportRequest)
      returns (GenerateRoutesSummaryReportResponse);
}

message GetFuelRequest { string id = 1; }

message GetFuelResponse { string fuel = 1; }

message GenerateGeneralReportRequest {
  string startDate = 1;
  string endDate = 2;
}

message VehicleSummary {
  double estimated = 1;
  double actual = 2;
}

message GenerateGeneralReportResponse {
  VehicleSummary LIGHT = 1;
  VehicleSummary HEAVY = 2;
  VehicleSummary ANY = 3;
}

message GenerateVehicleDetailReportRequest { VehicleType vehicleType = 1; }

enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  LIVIANO = 1;
  PESADO = 2;
  CUALQUIERA = 3;
}

message GenerateVehicleDetailReportResponse {
  repeated VehicleDetailSummary vehicles = 1;
}

message VehicleDetailSummary {
  int64 vehicle_id = 1;
  string vehicle_plate = 7;
  int64 trips = 2;
  double estimated = 3;
  double actual = 4;
  double difference = 5;
  double efficiency = 6;
}

message GenerateVehicleRoutesReportRequest {
  int64 vehicle_id = 1;
  string status = 2; // opcional: CREADO, EN_RUTA, EN_REVISION, TERMINADO
  VehicleType vehicle_type = 3; // LIVIANO, PESADO, CUALQUIERA
}

message GenerateVehicleRoutesReportResponse {
  repeated RouteDetailSummary routes = 1;
}

message RouteDetailSummary {
  int64 route_id = 1;
  string route_name = 2;
  string origin_name = 3;
  string destination_name = 4;
  double estimated = 5;
  double actual = 6;
  double difference = 7;
  // double deviation = 8;          // porcentaje de desviación
  repeated TripDetail trips = 9; // viajes asociados a esta ruta
}

message TripDetail {
  int64 id = 1;
  double fuel_estimated = 2;
  double fuel_actual = 3;
  double difference = 4;
  string start_time = 5;
  string end_time = 6;
  string driver_first_name = 7;
  string driver_last_name = 8;
}

message GenerateKPIsRequest {
  string status_filter = 1; // opcional: CREADO, EN_RUTA, EN_REVISION, TERMINADO
}

message GenerateKPIsResponse {
  int64 total_trips = 1;
  double average_efficiency = 2; // eficiencia promedio
}

message GenerateDriverRankingReportRequest {
  // Opcional: filtrar por estado de viaje
  string status_filter = 1; // opcional: CREADO, EN_RUTA, EN_REVISION, TERMINADO
}

message GenerateDriverRankingReportResponse {
  repeated DriverRankingSummary drivers = 1;
}

message DriverRankingSummary {
  int64 driver_id = 1;
  string driver_first_name = 2;
  string driver_last_name = 3;
  int64 total_trips = 4;
  int64 trips_creados = 5;
  int64 trips_en_ruta = 6;
  int64 trips_en_revision = 7;
  int64 trips_terminados = 8;
}

message GetDriverTripsRequest { int64 driver_id = 1; }

message GetDriverTripsResponse { repeated DriverTripDetail trips = 1; }

message DriverTripDetail {
  int64 trip_id = 1;
  string vehicle = 2;        // placa del vehículo
  string status = 3;         // EN_RUTA o TERMINADO
  string start_time = 4;     // formato: DD/MM HH:mm
  string end_time = 5;       // formato: DD/MM HH:mm (vacío si no ha terminado)
  double fuel_estimated = 6; // litros estimados
  double fuel_actual = 7;    // litros reales (0 si no está disponible)
  // Coordenadas de la ruta
  string origin_name = 8;
  string destination_name = 9;
  double origin_lat = 10;
  double origin_lng = 11;
  double destination_lat = 12;
  double destination_lng = 13;
}

message GenerateRoutesSummaryReportRequest {
  // Por el momento sin parámetros
}

message GenerateRoutesSummaryReportResponse {
  repeated RouteSummary routes = 1;
}

message RouteSummary {
  int64 route_id = 1;
  string route_name = 2;     // formato: "Origen → Destino"
  int64 total_trips = 3;
  double estimated = 4;      // consumo estimado en litros
  double actual = 5;         // consumo real en litros
  double difference = 6;      // diferencia en litros
  double efficiency = 7;      // eficiencia en porcentaje
}
