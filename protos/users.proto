syntax = "proto3";

package users;

service UserService {
  rpc GetUser (UserIdRequest) returns (UserResponse);
  rpc GetAllUsers (Empty) returns (UserList);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser (UserIdRequest) returns (DeleteResponse);
}

message Empty {}

message UserIdRequest {
  int64 user_id = 1;
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string username = 5;
  string password = 6;
  string status = 7;
}

message UpdateUserRequest {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string username = 6;
  string password = 7;
  string status = 8;
}

message RoleResponse {
  int64 role_id = 1;
  string name = 2;
}

message UserResponse {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string username = 6;
  string status = 7;
  repeated RoleResponse roles = 8;
}

message UserList {
  repeated UserResponse items = 1;
}

message DeleteResponse {
  bool success = 1;
}
