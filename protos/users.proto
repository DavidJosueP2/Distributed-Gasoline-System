syntax = "proto3";

package users;

service UserService {
  rpc GetUser (UserIdRequest) returns (UserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc GetAllUsers (Empty) returns (UserList);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser (UserIdRequest) returns (BooleanResponse);
  rpc UnDeleteUser (UserIdRequest) returns (BooleanResponse);
  rpc UpdatePassword (UpdatePasswordRequest) returns (BooleanResponse);
}


message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string username = 6;
  string password = 7;
  repeated RoleResponse roles = 8;
}

message Empty {}

message UserIdRequest {
  int64 user_id = 1;
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string username = 5;
  string password = 6;
  repeated int64 role_ids = 8;
}


message UpdateUserRequest {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string username = 6;
  string password = 7;
  string status = 8;
  repeated int64 role_ids = 9;
}

message RoleResponse {
  int64 role_id = 1;
  string name = 2;
}

message UserResponse {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string username = 6;
  repeated RoleResponse roles = 8;
}



message UserList {
  repeated UserResponse items = 1;
}

message BooleanResponse {
  bool success = 1;
}

message UpdatePasswordRequest {
  int64 user_id = 1;
  string new_password = 2;
}